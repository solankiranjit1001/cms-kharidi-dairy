<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00652c">
<meta name="description" content="ગુજરાતી દૈનિક શાકભાજી ખરીદી, વેચાણ, સ્ટોક અને વેપારી હિસાબ — પરિવાર માટે સહિયારો">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<title>CMS ખરીદી ડાયરી</title>
<script type="module" src="/js/main.js"></script>
</head>
<body>
<header class="top">
  <div><div class="eyebrow">દૈનિક હિસાબ • ભાવનગર</div><h1>🥬 CMS ખરીદી ડાયરી</h1></div>
  <div class="topright needauth" hidden><span id="userChip" class="userchip"></span><a class="iconbtn" href="#settings" aria-label="સેટિંગ્સ">⚙️</a></div>
</header>
<div class="datebar needauth" hidden>
  <div class="datectl">
    <button id="prevDay" class="btn light small" aria-label="આગલો દિવસ">◀</button>
    <label>તારીખ <input id="workDate" type="date"></label>
    <button id="nextDay" class="btn light small" aria-label="પછીનો દિવસ">▶</button>
    <button id="todayBtn" class="btn light small">આજે</button>
    <span id="dateLabel" class="muted"></span>
  </div>
  <span id="syncStatus"></span>
</div>
<nav class="nav needauth" id="nav" hidden></nav>
<main id="app"><div class="empty">લોડ થઈ રહ્યું છે…</div></main>
<footer class="noprint">CMS ખરીદી ડાયરી • બધો ડેટા સુરક્ષિત સર્વર પર સચવાય છે</footer>
<dialog id="modal"><form method="dialog" id="modalForm" novalidate><div id="modalContent"></div>
  <div class="modalactions"><button class="btn light" id="modalCancel" type="button">રદ કરો</button><button class="btn primary" id="modalSave" type="submit">સેવ કરો</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>આ એપ માટે JavaScript ચાલુ કરો.</noscript>
</body>
</html>
